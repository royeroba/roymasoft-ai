name: validate

on:
  push:
    branches: [master, release, dev]
  pull_request:
    branches: [master, release, dev]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Plugin and marketplace manifests are valid JSON
        run: |
          node -e "
            const fs = require('fs');
            const plugin = JSON.parse(fs.readFileSync('.claude-plugin/plugin.json', 'utf8'));
            const market = JSON.parse(fs.readFileSync('.claude-plugin/marketplace.json', 'utf8'));
            if (!plugin.name || !plugin.version) throw new Error('plugin.json needs name and version');
            const entry = market.plugins.find((p) => p.name === plugin.name);
            if (!entry) throw new Error('marketplace.json does not list ' + plugin.name);
            if (entry.version !== plugin.version) throw new Error('version mismatch between plugin.json and marketplace.json');
          "
